[package]
name = "iocc"
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Thiago Palmieri <palmieri@adastra.aleeas.com>"]
description = "This is a command line tool for communicating with I2C devices connected to the USBIOExtender"
readme = "README.md"
repository = "https://github.com/Thiapalm/iocc"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
embedded-hal = "0.2.6"
mcp2221 = "0.1.1"
dirs = "6"
ratatui = "0.30.2"
serde_json = "1.0.154"

[[bin]]
name = "iocc"
path = "src/main.rs"
