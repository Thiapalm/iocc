# Example section for the shared iocc config.yaml.
#
# Import it with `iocc config import config.example.yaml` (it can be run again
# after an update; existing sections are kept, `--force` replaces them).
# iocc only creates the file; `iocc config import` is the
# only command that edits it (adding the sections of another file) and the
# plugin writes back only `settings.gain`/`settings.threshold`
# when a TUI action changes them. Missing values fall back to the defaults in
# src/config.rs.
mydev:
  address: 0x4A
  verbose: false
  i2c_speed_hz: 400000 # in Hz
  reset_on_open: false
  timeout: 10 # in milliseconds
  settings:
    # Amplifier gain: 1, 2, 4 or 8
    gain: 1
    # Alert threshold in volts
    threshold: 2.0
